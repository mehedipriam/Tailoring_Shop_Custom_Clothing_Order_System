<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversations — Tailor Bhai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dash">

  <div class="dash-shell">
    <div class="dash-mobile-topbar">
      <button type="button" class="dash-hamburger" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
      <span class="dash-mobile-topbar__brand">Tailor Bhai</span>
    </div>
    <div class="dash-backdrop"></div>
    <aside class="dash-sidebar">
      <div class="dash-sidebar__header">
        <p class="dash-sidebar__brand">Tailor Bhai</p>
        <p class="dash-sidebar__sub">Delivery Hub</p>
      </div>

      <nav class="dash-nav">
        <a href="delivery-dashboard.html" class="dash-nav__item">
          <span class="dash-nav__icon">🏠</span>
          <span class="dash-nav__label">Dashboard</span>
        </a>
        <a href="delivery-detail.html" class="dash-nav__item">
          <span class="dash-nav__icon">📦</span>
          <span class="dash-nav__label">Delivery Detail</span>
        </a>
        <a href="delivery-chat.html" class="dash-nav__item dash-nav__item--active">
          <span class="dash-nav__icon">💬</span>
          <span class="dash-nav__label">Chat</span>
        </a>
      </nav>

      <div class="dash-sidebar__footer">
        <a href="index.html" class="dash-signout">
          <span class="dash-signout__icon">→</span>
          <span>Sign Out</span>
        </a>
      </div>
    </aside>

    <main class="dash-main dash-main--flush">
      <div class="chat-shell chat-shell--idle" id="chatShell">
        <div class="chat-list">
          <div class="chat-list__head">
            <h2 class="chat-list__title">Conversations</h2>
            <p class="chat-list__count" id="chatCount">3 conversations</p>
          </div>
          <div class="chat-list__items" id="chatThreads"></div>
        </div>

        <div class="chat-panel">
          <div class="chat-panel__head" id="chatHead"></div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-attachment-preview" id="chatAttachmentPreview">
            <img id="chatAttachmentImg" src="" alt="Attached image">
            <button type="button" class="chat-attachment-remove" id="chatAttachmentRemove" aria-label="Remove attachment">✕</button>
          </div>
          <div class="chat-input-bar">
            <button type="button" class="chat-attach" id="chatAttachBtn" aria-label="Attach image" title="Attach image">📎</button>
            <input type="file" id="chatImageInput" accept="image/*" style="display:none">
            <input type="text" class="chat-input" id="chatInput" placeholder="Coordinate delivery, confirm address or timing...">
            <button type="button" class="chat-send" id="chatSend" disabled>↑</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Demo role switcher -->
  <div class="demo-switcher">
    <span class="demo-switcher__label">Demo</span>
    <a href="index.html" class="demo-switcher__item" aria-label="Guest" title="Guest">
      <span class="demo-switcher__icon">👤</span><span class="demo-switcher__text">Guest</span>
    </a>
    <a href="customer-dashboard.html" class="demo-switcher__item" aria-label="Customer" title="Customer">
      <span class="demo-switcher__icon">🧵</span><span class="demo-switcher__text">Customer</span>
    </a>
    <a href="tailor-dashboard.html" class="demo-switcher__item" aria-label="Tailor" title="Tailor">
      <span class="demo-switcher__icon">✂️</span><span class="demo-switcher__text">Tailor</span>
    </a>
    <a href="delivery-dashboard.html" class="demo-switcher__item demo-switcher__item--active" aria-label="Delivery" title="Delivery">
      <span class="demo-switcher__icon">🚚</span><span class="demo-switcher__text">Delivery</span>
    </a>
    <a href="#admin" class="demo-switcher__item" aria-label="Admin" title="Admin">
      <span class="demo-switcher__icon">⚙️</span><span class="demo-switcher__text">Admin</span>
    </a>
  </div>

  <script src="js/main.js"></script>
  <script src="js/dash-sidebar.js"></script>
  <script src="js/delivery-chat.js"></script>
</body>
</html>
